# OWNER REVIEW ONLY. Do not merge or promote this branch.
[build]
  command = "node scripts/build-review-preview.mjs"
  publish = "review-dist"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "review/empty-functions"
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
