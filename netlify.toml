[build]
  # `npx puppeteer browsers install chrome` is required because Netlify caches
  # node_modules between builds, so puppeteer's postinstall (which downloads
  # Chrome) doesn't re-run on cached installs. Running it explicitly is fast
  # (~2s) when Chrome is already cached, and idempotent otherwise.
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 + react-router 7 require Node >= 20.19; bump to 22 LTS to match.
  NODE_VERSION = "22"
  # Cache Chrome between builds in Netlify's persistent cache dir.
  PUPPETEER_CACHE_DIR = "/opt/build/cache/puppeteer"

[[redirects]]
  from = "/case-studies/heritage-sandstone-seawall-vaucluse"
  to = "/case-studies/heritage-sandstone-seawall-mosman/"
  status = 301

[[redirects]]
  from = "/case-studies/heritage-sandstone-seawall-vaucluse/"
  to = "/case-studies/heritage-sandstone-seawall-mosman/"
  status = 301

# Redirect old /projects path to /gallery
[[redirects]]
  from = "/projects"
  to = "/gallery"
  status = 301

# Redirect removed service pages
[[redirects]]
  from = "/services/waterproofing"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/restoration"
  to = "/services/building-restoration"
  status = 301

# Preserve the query-dependent search route as a noindex SPA entry.
[[redirects]]
  from = "/search"
  to = "/index.html"
  status = 200

# All indexable application routes are prerendered. Unknown paths must return
# a real HTTP 404 rather than a soft-404 copy of the home-page shell.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/search"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache gallery images aggressively (1 year)
[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache other static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Make answer-engine knowledge files fast, explicit and crawlable.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
